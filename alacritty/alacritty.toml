[window]
dynamic_padding = true
blur = true
decorations = "None"
startup_mode = "Windowed"
padding = {x = 3, y = 3}
# opacity = 0.8

[scrolling]
history = 10000

[selection]
save_to_clipboard = true

[mouse]
hide_when_typing = true

[font]
size = 12
normal = { family = "SF Mono", style = "SemiBold" }

[general]
import = [ "./themes/one_dark.toml" ]

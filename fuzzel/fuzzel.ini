[main]
font = SF Pro:size=10:weight=SemiBold
prompt = " "
dpi-aware = yes
anchor = center
inner-pad = 8
horizontal-pad = 32
vertical-pad = 16
lines = 8
hide-prompt = true

[colors]
background = 282c34ff
text = abb2bfff
border = abb2bfff
selection = abb2bfff
selection-text = 282c34ff
; selection-match = e06c75ff

[border]
radius = 8
width = 1

[key-bindings]
prev = Mod1+k
next = Mod1+j
